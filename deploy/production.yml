apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  annotations:
    releaserush.io/flag: FLAG{PHASE1_GIT_RECOVERY}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      containers:
        - name: inventory-api
          image: inventory-api:2.0
          ports:
            - containerPort: 8000
